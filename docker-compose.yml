version: '3.8'

services:
  # PostgreSQL (Relational Data & Full-Text Search BM25)
  postgres:
    image: postgres:16-alpine
    container_name: vietlegal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vietlegal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: vietlegal_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Redis (Semantic Cache & Rate Limiter)
  redis:
    image: redis:7-alpine
    container_name: vietlegal_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  qdrant_storage:
  redis_data:
