version: '3.8'

services:
  # ============================================================================
  # 1. Qdrant Vector Database
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: vietlegal_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. FastAPI Backend Service (CPU PyTorch, SSE Streaming, Fast Liveness Probe)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vietlegal_backend
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - C:/Users/vuong/.cache/huggingface:/root/.cache/huggingface:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================================
  # 3. React Frontend & Nginx Reverse Proxy (SSE Streaming Unbuffered)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vietlegal_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
